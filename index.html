<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Family Tree Visualizer Pro</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<button id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle Sidebar">☰</button>

<aside id="sidebar" class="sidebar">
  <div class="brand"><h1 id="appTitle">Family Tree</h1><p id="appSubtitle">Visualizer</p></div>

  <div class="section">
    <div class="section-title" id="searchSection">Search</div>
    <div class="field">
      <input id="search" type="search" placeholder="Search person...">
    </div>
  </div>

  <div class="section">
    <div class="section-title" id="treeSection">Tree</div>
    <div class="row">
      <button id="addRoot" class="primary">+ Add Root</button>
      <button id="reset">Reset</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title" id="selectedSection">Selected Person</div>
    <div id="selectedBox" class="selected" aria-live="polite"><strong>None selected</strong>Click a person in the tree.</div>
    <div class="row">
      <button id="addChild" class="primary">+ Add Child</button>
      <button id="edit">Edit</button>
    </div>
    <button id="delete" class="danger" style="width:100%;margin-top:8px">Delete Person</button>
  </div>

  <div class="section">
    <div class="section-title" id="designSection">Design</div>
    <div class="field"><label id="widthLabel" for="cardWidth">Card Width</label><input id="cardWidth" type="range" min="130" max="280" value="180"></div>
    <div class="field"><label id="spacingLabel" for="spacing">Child Spacing</label><input id="spacing" type="range" min="15" max="100" value="42"></div>
    <div class="field"><label id="generationLabel" for="generation">Generation Spacing</label><input id="generation" type="range" min="30" max="90" value="54"></div>
  </div>

  <div class="section">
    <div class="section-title" id="languageSection">Language</div>
    <div class="field"><label id="languageLabel" for="language">Interface Language</label>
      <select id="language">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="ne">नेपाली</option>
        <option value="bn">বাংলা</option>
        <option value="mr">मराठी</option>
        <option value="ta">தமிழ்</option>
        <option value="te">తెలుగు</option>
        <option value="gu">ગુજરાતી</option>
        <option value="pa">ਪੰਜਾਬੀ</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-title" id="dataSection">Data</div>
    <div class="row"><button id="export">Export</button><button id="import">Import</button></div>
    <input id="file" type="file" accept=".json" hidden>
  </div>

  <div class="section">
    <div class="section-title" id="aboutSection">Beta</div>
    <div class="hint" id="aboutText">Create roots, children, edit names, delete branches, customize spacing, drag to pan, change language, and export/import the tree.</div>
  </div>
</aside>

<main class="workspace">
<header class="toolbar">
  <div class="toolbar-left"><span class="toolbar-title" id="treeTitle">My Family Tree</span></div>
  <div class="toolbar-right">
    <button id="zoomOut" aria-label="Zoom out">−</button><span id="zoomLabel" class="zoom-label">100%</span><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomReset">Reset View</button>
  </div>
</header>
<section id="canvas" class="canvas">
  <div id="stage" class="stage">
    <svg id="svgOverlay" class="svg-overlay"></svg>
    <div id="tree"></div>
  </div>
  <div id="toast" class="toast" aria-live="polite"></div>
</section>
</main>
</div>

<!-- Modal Dialog -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle" class="modal-title">Prompt</h2>
    <div id="modalBody" class="modal-body"></div>
    <div class="modal-actions">
      <button id="modalCancel">Cancel</button>
      <button id="modalConfirm" class="primary">Confirm</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
